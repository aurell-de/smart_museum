<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   <header class="navbar">
    <div class="logo">MuseumX</div>

    <div class="search-box">
        <input type="text" placeholder="Cari...">
    </div>

    <nav class="menu">
        <a href="index.html">Home</a>
        <a href="scan.html">Scan</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="Kuis.html">QuiZ</a>
    </nav>
</header>
<!-- ================= QUIZ CATEGORY ================= -->

<section class="quiz">

    <h2>Kuis Museum Bengkulu</h2>

    <!-- MENU KATEGORI -->
    <div class="quiz-category">

        <button onclick="showQuiz('etnografi')">
            Etnografi
        </button>

        <button onclick="showQuiz('arkeologi')">
            Arkeologi
        </button>

        <button onclick="showQuiz('filologi')">
            Filologi
        </button>

    </div>

    <!-- ================= ETNOGRAFI ================= -->
    <div id="etnografi" class="quiz-box">

        <div class="question">
            <p>1. Apa contoh koleksi etnografi di Museum Bengkulu?</p>

            <button>Kain tradisional</button>
            <button>Fosil dinosaurus</button>
            <button>Komputer</button>
        </div>

    </div>

    <!-- ================= ARKEOLOGI ================= -->
    <div id="arkeologi" class="quiz-box" style="display: none;">
        <div class="question">
            <p>1. Arkeologi mempelajari tentang?</p>

            <button>Peninggalan sejarah</button>
            <button>Teknologi modern</button>
            <button>Musik daerah</button>
        </div>
    </div>

    <!-- ================= FILOLOGI ================= -->
   <div id="filologi" class="quiz-box" style="display: none;">

    <div class="question">

        <p>1. Filologi berkaitan dengan?</p>

        <button>Naskah kuno</button>
        <button>Bangunan modern</button>
        <button>Permainan tradisional</button>

    </div>
</div>

</section>

<script>

function showQuiz(category){

    document.getElementById("etnografi").style.display = "none";
    document.getElementById("arkeologi").style.display = "none";
    document.getElementById("filologi").style.display = "none";

    document.getElementById(category).style.display = "block";
}

</script>
</body>
</html>
